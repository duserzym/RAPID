name: Qualify the portable Windows bundle

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out the candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up the build interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install declared build dependencies
        shell: pwsh
        run: python -m pip install "setuptools>=69" wheel "./RapidPy[build]"
      - name: Run the Data Review regression suite
        shell: pwsh
        run: |
          python -u tools/test_rapid_main.py --suite data_viewer --verbose --stall-trace > data-review-tests.log 2>&1
          if ($LASTEXITCODE -ne 0) { Get-Content data-review-tests.log -Tail 120; exit 1 }
      - name: Run the main-app regression suite in separate processes
        shell: pwsh
        run: |
          $groups = @(
            @{ Name = 'a-l'; Pattern = 'test_[a-l]*.py' },
            @{ Name = 'm-p'; Pattern = 'test_[m-p]*.py' },
            @{ Name = 'q'; Pattern = 'test_q*.py' },
            @{ Name = 'remaining'; Pattern = 'test*.py'; Exclude = @(
                'test_[a-l]*.py', 'test_[m-p]*.py', 'test_q*.py', 'test_sequence_ui_smoke.py'
            ) }
          )
          foreach ($group in $groups) {
            $testArguments = @('--pattern', $group.Pattern, '--verbose', '--stall-trace')
            foreach ($pattern in $group.Exclude) {
              $testArguments += @('--exclude-pattern', $pattern)
            }
            $log = "rapidpy-main-$($group.Name).log"
            python -u tools/test_rapid_main.py @testArguments > $log 2>&1
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 120; exit 1 }
          }
      - name: Run the Sequence layout checks on a desktop work area
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen:configfile=tools/sequence-test-display.json
        run: |
          python -u tools/test_rapid_main.py --pattern test_sequence_ui_smoke.py --verbose --stall-trace > sequence-layout-tests.log 2>&1
          if ($LASTEXITCODE -ne 0) { Get-Content sequence-layout-tests.log -Tail 120; exit 1 }
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rapidpy-windows-regression
          path: |
            rapidpy-main-*.log
            data-review-tests.log
            sequence-layout-tests.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Build the portable release
        shell: pwsh
        run: .\installer\build_rapid_main.ps1 -Python (Get-Command python.exe).Source -SourceRevision $env:GITHUB_SHA
      - name: Upload the exact bundle for qualification
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rapidpy-portable-windows
          path: dist/RapidPyMain/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download only the portable release
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: rapidpy-portable-windows
          path: ${{ runner.temp }}/RAPID Portable
      - name: Verify the relocated release on this runner
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'RAPID Portable'
          $evidence = Join-Path $env:RUNNER_TEMP 'RAPID qualification'
          & (Join-Path $bundle 'Verify-RapidPy.ps1') -RequireFullInventory -EvidenceDirectory $evidence -MeasurePerformance
          $report = Get-ChildItem -LiteralPath $evidence -Filter verification.json -File -Recurse |
              Get-Content -Raw | ConvertFrom-Json
          if (-not $report.passed -or $report.inventory.source_revision -cne $env:GITHUB_SHA) {
              throw 'The verified bundle does not identify the candidate commit.'
          }
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rapidpy-portable-qualification
          path: |
            ${{ runner.temp }}/RAPID qualification/**/verification.json
            ${{ runner.temp }}/RAPID qualification/**/*.log
          if-no-files-found: ignore
          retention-days: 14
