name: Qualify the portable Windows bundle

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out the candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up the build interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install declared build dependencies
        shell: pwsh
        run: python -m pip install "setuptools>=69" wheel "./RapidPy[build]"
      - name: Run the main-app regression suite
        shell: pwsh
        run: |
          python -u tools/test_rapid_main.py --verbose --stall-trace > rapidpy-tests.log 2>&1
          if ($LASTEXITCODE -ne 0) { Get-Content rapidpy-tests.log -Tail 120; exit 1 }
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rapidpy-windows-regression
          path: rapidpy-tests.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Build the portable release
        shell: pwsh
        run: .\installer\build_rapid_main.ps1 -Python (Get-Command python.exe).Source -SourceRevision $env:GITHUB_SHA
      - name: Upload the exact bundle for qualification
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rapidpy-portable-windows
          path: dist/RapidPyMain/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download only the portable release
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: rapidpy-portable-windows
          path: ${{ runner.temp }}/RAPID Portable
      - name: Verify the relocated release on this runner
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'RAPID Portable'
          $evidence = Join-Path $env:RUNNER_TEMP 'RAPID qualification'
          & (Join-Path $bundle 'Verify-RapidPy.ps1') -RequireFullInventory -EvidenceDirectory $evidence
          $report = Get-ChildItem -LiteralPath $evidence -Filter verification.json -File -Recurse |
              Get-Content -Raw | ConvertFrom-Json
          if (-not $report.passed -or $report.inventory.source_revision -cne $env:GITHUB_SHA) {
              throw 'The verified bundle does not identify the candidate commit.'
          }
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rapidpy-portable-qualification
          path: |
            ${{ runner.temp }}/RAPID qualification/**/verification.json
            ${{ runner.temp }}/RAPID qualification/**/*.log
          if-no-files-found: ignore
          retention-days: 14
