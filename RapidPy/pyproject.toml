[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "berkeley-rapidpy"
version = "4.0.0"
description = "RAPID paleomagnetism instrument control and analysis applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<6.9",
  "numpy>=1.26,<3",
  "pyqtgraph>=0.13,<0.14",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]
test = ["coverage>=7,<8"]

[project.scripts]
rapid-main = "rapid_main.__main__:console_main"
rapid-af-tuner = "af_tuner.app:main"
rapid-data-viewer = "data_viewer.app:main"
rapid-gaussmeter = "gaussmeter_control.app:main"
rapid-updown = "updown_control.app:main"
rapid-vrm = "vrm_logger.app:main"
rapid-webcam = "webcam_viewer.app:main"

[tool.setuptools]
include-package-data = true
packages = [
  "rapid_main",
  "rapid_main.dialogs",
  "rapid_main.io",
  "rapid_main.panels",
  "rapid_main_assets",
  "rapidpy_common",
  "af_tuner",
  "af_tuner_assets",
  "data_viewer",
  "data_viewer_assets",
  "gaussmeter_control",
  "gaussmeter_control_assets",
  "updown_control",
  "updown_control_assets",
  "vrm_logger",
  "vrm_logger_assets",
  "webcam_viewer",
  "webcam_viewer_assets",
]

[tool.setuptools.package-dir]
rapid_main = "rapid_main/rapid_main"
rapid_main_assets = "rapid_main/assets"
rapidpy_common = "rapidpy_common"
af_tuner = "af_tuner/af_tuner"
af_tuner_assets = "af_tuner/assets"
data_viewer = "data_viewer/data_viewer"
data_viewer_assets = "data_viewer/assets"
gaussmeter_control = "gaussmeter_control/gaussmeter_control"
gaussmeter_control_assets = "gaussmeter_control/assets"
updown_control = "updown_control/updown_control"
updown_control_assets = "updown_control/assets"
vrm_logger = "vrm_logger/vrm_logger"
vrm_logger_assets = "vrm_logger/assets"
webcam_viewer = "webcam_viewer/webcam_viewer"
webcam_viewer_assets = "webcam_viewer/assets"

[tool.setuptools.package-data]
rapid_main_assets = ["*.png", "*.ico"]
rapidpy_common = ["assets/*.svg"]
af_tuner_assets = ["*.png", "*.ico"]
data_viewer_assets = ["*.png", "*.ico"]
gaussmeter_control_assets = ["*.png", "*.ico"]
updown_control = ["assets/*.svg"]
updown_control_assets = ["*.png", "*.ico"]
vrm_logger_assets = ["*.png", "*.ico"]
webcam_viewer_assets = ["*.png", "*.ico"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]

